[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cheminformatics_similarity"
version = "0.1.0"
description = "Utility functions to calculate chemical similarity for cheminformatics workflows."
readme = "README.md"
authors = [{ name = "Kevin Spiekermann" }]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "pandas>=3.1",
    "rdkit>=2026.9",
    "seaborn>=0.13",
]

[project.urls]
source = "https://github.com/kspieks/cheminformatics_similarity"

[dependency-groups]
# Extra packages needed only to run the example notebooks
notebooks = [
    "ipykernel>=7.4",
    "ipywidgets>=8.1",
    "jupyterlab>=4.6",
    "notebook>=7.6",
    "scipy>=1.18",
]
# Extra packages needed only for examples/visualize_chemical_space.ipynb.
# Install with `uv sync --group chemspace`. BMLC comes from GitHub (see [tool.uv.sources]).
chemspace = [
    "bmlc",
    "descriptastorus>=2.8",
    "scikit-learn>=1.9",
    "umap-learn>=0.6",
]

[tool.setuptools.packages.find]
include = ["cheminformatics_similarity*"]

[tool.uv]
# Use a uv-managed Python, not one from Anaconda or the system
python-preference = "only-managed"
default-groups = ["notebooks"]

[tool.uv.sources]
# uv.lock pins the commit. Update with `uv lock --upgrade-package bmlc`.
bmlc = { git = "https://github.com/kspieks/BMLC", branch = "main" }
